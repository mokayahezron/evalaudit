[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalaudit"
version = "0.3.0"
description = "Statistical validity checks for human-graded AI evaluations. Rater agreement, judge validation, and whether your result holds up."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Hezron Mokaya", email = "ondibahezron@gmail.com" }]
keywords = ["llm", "evaluation", "statistics", "inter-rater-reliability", "krippendorff", "bradley-terry", "llm-as-judge", "annotation-quality"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "pandas>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "statsmodels>=0.14",
    "krippendorff>=0.6",
    # Independent Bradley-Terry fit, used to check pairwise. It needs 3.10,
    # and this package supports 3.9, so on 3.9 the choix checks skip and the
    # statsmodels and slow-reference checks carry the fit on their own.
    "choix>=0.4; python_version>='3.10'",
]

[project.urls]
Homepage = "https://github.com/mokayahezron/evalaudit"
Issues = "https://github.com/mokayahezron/evalaudit/issues"

[tool.hatch.build.targets.wheel]
packages = ["evalaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
